<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- 20px precision dot matrix -->
    <pattern id="dotMatrixSlate" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="#CBD5E1" opacity="0.30" />
    </pattern>
    <!-- 80px technical subgrid -->
    <pattern id="minorGridSlate" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none" stroke="#616E7C" stroke-width="0.8" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Mid-Tone Slate Smoke Grey Studio Canvas (#7B8794) -->
  <rect width="320" height="320" fill="#7B8794" />

  <!-- Dotted Sub-Matrix -->
  <rect width="320" height="320" fill="url(#dotMatrixSlate)" />

  <!-- 80px Major Drafting Grid -->
  <rect width="320" height="320" fill="url(#minorGridSlate)" />

  <!-- Primary CAD Division Lines -->
  <line x1="160" y1="0" x2="160" y2="320" stroke="#52606D" stroke-width="1" opacity="0.55" />
  <line x1="0" y1="160" x2="320" y2="160" stroke="#52606D" stroke-width="1" opacity="0.55" />

  <!-- Technical Crosshairs (+) at Intersections -->
  <g stroke="#E2E8F0" stroke-width="1.2" opacity="0.65" stroke-linecap="square">
    <!-- Intersection (80, 80) -->
    <line x1="74" y1="80" x2="86" y2="80" />
    <line x1="80" y1="74" x2="80" y2="86" />

    <!-- Intersection (240, 80) -->
    <line x1="234" y1="80" x2="246" y2="80" />
    <line x1="240" y1="74" x2="240" y2="86" />

    <!-- Intersection (80, 240) -->
    <line x1="74" y1="240" x2="86" y2="240" />
    <line x1="80" y1="234" x2="80" y2="246" />

    <!-- Intersection (240, 240) -->
    <line x1="234" y1="240" x2="246" y2="240" />
    <line x1="240" y1="234" x2="240" y2="246" />
  </g>

  <!-- Center Target Matrix Node (160, 160) -->
  <circle cx="160" cy="160" r="14" fill="none" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
  <circle cx="160" cy="160" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.75">
    <line x1="152" y1="160" x2="168" y2="160" />
    <line x1="160" y1="152" x2="160" y2="168" />
  </g>

  <!-- Precision Corner Registration Marks -->
  <path d="M4,16 L4,4 L16,4" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.5" />
  <path d="M316,16 L316,4 L304,4" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.5" />
  <path d="M4,304 L4,316 L16,316" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.5" />
  <path d="M316,304 L316,316 L304,316" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0.5" />

  <!-- Technical Coordinate Annotations -->
  <text x="86" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Segoe UI Mono', monospace" font-size="6.5" font-weight="600" fill="#E2E8F0" opacity="0.55" letter-spacing="0.08em">12.8248°N // 80.0573°E</text>
  <text x="246" y="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Segoe UI Mono', monospace" font-size="6" font-weight="600" fill="#E2E8F0" opacity="0.55" letter-spacing="0.08em">SPEC // CAD-01</text>
  <text x="86" y="248" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Segoe UI Mono', monospace" font-size="6" font-weight="600" fill="#E2E8F0" opacity="0.55" letter-spacing="0.08em">+80MM</text>
</svg>
