<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Base Background with subtle prismatic ambient sheen -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Funky Dichroic Wave 1: Prismatic Cyan-to-Silver Glass Wave -->
    <linearGradient id="dichroicWave1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#E0E7FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#FCE7F3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.7" />
    </linearGradient>

    <!-- Funky Dichroic Wave 2: Frosted Electric Lime & Violet Caustic Ribbon -->
    <linearGradient id="dichroicWave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#E2E8F0" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#DDD6FE" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#D9F99D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.55" />
    </linearGradient>

    <!-- Funky Dichroic Wave 3: Holographic Silver & Coral Wave Crest -->
    <linearGradient id="dichroicWave3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#FED7AA" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#A7F3D0" stop-opacity="0.45" />
      <stop offset="90%" stop-color="#C7D2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>

    <!-- Funky Dichroic Wave 4: Dynamic Sweeping Liquid Neon Glass Ribbon -->
    <linearGradient id="dichroicWave4" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#FBCFE8" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#F1F5F9" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#67E8F9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.65" />
    </linearGradient>

    <!-- Wave 5: Lower Seamless Loop Wave with Neon Aura -->
    <linearGradient id="dichroicWave5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#E9D5FF" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#CCFBF1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Iridescent Specular Stroke Gradients -->
    <linearGradient id="strokeSpec1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="strokeSpec2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#A3E635" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="strokeSpec3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.85" />
    </linearGradient>

    <!-- Prismatic Ambient Caustics -->
    <radialGradient id="funkyCaustic1" cx="20%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#F3E8FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="funkyCaustic2" cx="80%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ECFCCB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="funkyCaustic3" cx="30%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#FCE7F3" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#EDE9FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Ambient Glass Shadows -->
    <filter id="funkyGlassDepth" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#334155" flood-opacity="0.12" />
    </filter>

    <filter id="funkyGlow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A5F3FC" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="1400" fill="url(#bgBase)" />

  <!-- Multi-color Prismatic Caustic Glows -->
  <rect width="1920" height="1400" fill="url(#funkyCaustic1)" />
  <rect width="1920" height="1400" fill="url(#funkyCaustic2)" />
  <rect width="1920" height="1400" fill="url(#funkyCaustic3)" />

  <!-- Wave 1 (y: 180-320) with Iridescent Gradient & Neon Crest -->
  <path d="M-100,180 C360,340 640,90 1100,260 C1560,430 1780,200 2040,130 L2040,1500 L-100,1500 Z" fill="url(#dichroicWave1)" filter="url(#funkyGlassDepth)" />
  <path d="M-100,180 C360,340 640,90 1100,260 C1560,430 1780,200 2040,130" fill="none" stroke="url(#strokeSpec1)" stroke-width="3.5" filter="url(#funkyGlow)" />

  <!-- Wave 2 (y: 440-580) with Volt & Violet Liquid Glass Flow -->
  <path d="M-100,440 C280,620 700,300 1160,520 C1620,740 1760,400 2040,480 L2040,1500 L-100,1500 Z" fill="url(#dichroicWave2)" filter="url(#funkyGlassDepth)" />
  <path d="M-100,440 C280,620 700,300 1160,520 C1620,740 1760,400 2040,480" fill="none" stroke="url(#strokeSpec2)" stroke-width="4" filter="url(#funkyGlow)" />

  <!-- Wave 3 (y: 720-860) with Holographic Wave Crest -->
  <path d="M-100,720 C340,520 780,840 1240,630 C1700,420 1860,680 2040,590 L2040,1500 L-100,1500 Z" fill="url(#dichroicWave3)" filter="url(#funkyGlassDepth)" />
  <path d="M-100,720 C340,520 780,840 1240,630 C1700,420 1860,680 2040,590" fill="none" stroke="url(#strokeSpec3)" stroke-width="4" filter="url(#funkyGlow)" />

  <!-- Wave 4 (y: 980-1120) with Cyan & Peach Glass Dune -->
  <path d="M-100,980 C380,1160 820,860 1280,1050 C1740,1240 1880,940 2040,1020 L2040,1500 L-100,1500 Z" fill="url(#dichroicWave4)" filter="url(#funkyGlassDepth)" />
  <path d="M-100,980 C380,1160 820,860 1280,1050 C1740,1240 1880,940 2040,1020" fill="none" stroke="url(#strokeSpec1)" stroke-width="3.5" filter="url(#funkyGlow)" />

  <!-- Wave 5 (y: 1220-1340) -->
  <path d="M-100,1220 C420,1060 840,1320 1320,1170 C1800,1020 1920,1220 2040,1150 L2040,1500 L-100,1500 Z" fill="url(#dichroicWave5)" filter="url(#funkyGlassDepth)" />
  <path d="M-100,1220 C420,1060 840,1320 1320,1170 C1800,1020 1920,1220 2040,1150" fill="none" stroke="url(#strokeSpec2)" stroke-width="3" />
</svg>
